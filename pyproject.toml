[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "altbionics"
version = "0.1.0"
description = "Pure-Python drivers for the Alt-Bionics Surge robot hand and Manus MetaGloves Pro."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Norman Redlich" }]
keywords = ["robotics", "teleoperation", "imitation-learning", "alt-bionics", "surge", "manus", "lerobot"]
dependencies = [
    "numpy",
    "pyserial",
]

[project.optional-dependencies]
examples = ["pygame", "mido", "python-rtmidi"]

[project.urls]
Homepage = "https://github.com/anredlich/altbionics"
Repository = "https://github.com/anredlich/altbionics"

[tool.setuptools]
packages = ["altbionics"]
